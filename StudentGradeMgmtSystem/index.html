<!DOCTYPE html>
<html>
<head>
    <title>Student Grade Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center mb-4">Student Grade Management System</h1>

        <div class="card mb-4">
            <div class="card-header">
                <h3>Add Student</h3>
            </div>

            <div class="card-body">
                <form id="studentForm">
                    <div class="d-flex align-items-end gap-4">

                        <div>
                            <label class="form-label">Student Name:</label>
                            <input type="text" id="studentName" class="form-control name-input" placeholder="Student Name">
                        </div>

                        <div>
                            <label class="form-label">Math:</label>
                            <input type="number" id="math" class="form-control mark-input" placeholder="Math">
                        </div>

                        <div>
                            <label class="form-label">Science:</label>
                            <input type="number" id="science" class="form-control mark-input" placeholder="Science">
                        </div>

                        <div>
                            <label class="form-label">English:</label>
                            <input type="number" id="english" class="form-control mark-input" placeholder="English">
                        </div>

                        <div>
                            <label class="form-label">History:</label>
                            <input type="number" id="history" class="form-control mark-input" placeholder="History">
                        </div>
                        <button type="submit" class="btn btn-primary">Add Student</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card mb-4">

            <div class="card-header">
                <h3>Student Records</h3>
            </div>

            <div class="card-body">

                <label class="form-label">Filter by Grade:</label>
                <select id="gradeFilter" class="form-select filter-select" onchange="filterStudents(this.value)">
                    <option value="All">All Grades</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                    <option value="F">F</option>
                </select>

                <div class="table-responsive mt-3">
                    <table class="table table-bordered table-hover text-center">
                        <thead class="table-primary">
                            <tr>
                                <th>Name</th>
                                <th>Math</th>
                                <th>Science</th>
                                <th>English</th>
                                <th>History</th>
                                <th>Total</th>
                                <th>Average</th>
                                <th>Grade</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="studentTable">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header">
                <h3>Class Summary</h3>
            </div>

            <div class="card-body">
                <p>
                    <b>Total Students:</b>
                    <span id="totalStudents">0</span>
                </p>

                <p>
                    <b>Class Average:</b>
                    <span id="classAverage">0</span>
                </p>

                <p>
                    <b>Highest Score:</b>
                    <span id="highestScore">0</span>
                </p>

                <p>
                    <b>Lowest Score:</b>
                    <span id="lowestScore">0</span>
                </p>
            </div>
        </div>

        <button onclick="exportData()" class="btn btn-success mb-4">Export Data as JSON</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
